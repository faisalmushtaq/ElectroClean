# Builds the stand-alone ElectroClean applications for Windows, macOS and Linux,
# checks each one with its own --self-test, and runs the test-suite on the same
# three systems. See docs/building_apps.md.
#
# The full set (tests and builds on all three systems) runs for pushes to main,
# pull requests into main, version tags such as v1.1.0, and when it is started
# by hand ("Run workflow" in the Actions tab). Pushes to other branches only run
# the test-suite on Linux, which is quicker. For a version tag, or when the
# workflow is run by hand on main with "Publish a release" ticked, the three
# applications are then attached to a GitHub release (the "release" job).
name: Build applications

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of this version (main only; the version is __version__ in electroclean/__init__.py)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Qt's run-time needs on Ubuntu. The xcb packages are not needed offscreen, but when they are present
  # PyInstaller bundles them, so annotators' Linux machines need not have them (libxcb-cursor0 in particular).
  LINUX_QT_PACKAGES: >-
    libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
    libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
    libxcb-shape0 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux only for pushes to branches other than main; all three systems otherwise (see the top of this file).
        os: ${{ fromJSON((github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) && '["ubuntu-22.04"]' || '["windows-latest", "macos-latest", "ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_QT_PACKAGES
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run the test-suite
        run: python -m pytest -q

  build:
    name: Build (${{ matrix.os }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon (arm64). Intel Macs would need an Intel runner such as
        # macos-15-intel, added here as a fourth entry.
        os: [windows-latest, macos-latest, ubuntu-22.04]  # 22.04: older glibc, so the Linux build runs on more systems
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_QT_PACKAGES
      # Fresh build environment, PyInstaller, frozen --self-test, console tools' --help, zip.
      - name: Build and test the applications
        id: build
        run: python packaging/build.py --zip
      - name: Upload the applications
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.zip }}
          archive: false  # the artifact is the zip itself (ElectroClean-<os>-<arch>.zip), not a zip of it
          retention-days: 30
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.os }}
          path: |
            build/selftest-*.log
            build/pyinstaller/electroclean/warn-electroclean.txt
            build/pyinstaller/electroclean/xref-electroclean.html
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Publish the release
    # For version tags, or a run by hand on main with "Publish a release" ticked, and only when
    # every test and build has passed. In the second case the job creates the v<version> tag itself.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # to create the release and attach the files
    steps:
      - uses: actions/checkout@v7
      - name: Check the version and the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('electroclean/__init__.py').read_text(encoding='utf-8')).group(1))")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match electroclean.__version__ ($version)"
              exit 1
            fi
          elif gh release view "$tag" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag has already been released (or tagged); set a new __version__ and CHANGELOG.md section first"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section '## $VERSION'"
            exit 1
          fi
      - name: Download the three applications
        uses: actions/download-artifact@v8
        with:
          pattern: ElectroClean-*.zip
          path: release
          merge-multiple: true
          skip-decompress: true  # keep each zip as built
      - name: Check the files
        run: |
          ls -l release
          for os in windows-x64 macos-arm64 linux-x64; do
            f="release/ElectroClean-$os.zip"
            test -s "$f" || { echo "::error::$f is missing"; exit 1; }
            unzip -tq "$f" > /dev/null || { echo "::error::$f is not a valid zip file"; exit 1; }
          done
          (cd release && sha256sum ElectroClean-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create the release and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            where="--verify-tag"
          else
            where="--target $GITHUB_SHA"  # creates the tag on the commit that was tested and built
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" release/ElectroClean-*.zip release/SHA256SUMS.txt \
            $where --title "ElectroClean $VERSION" --notes-file release-notes.md
