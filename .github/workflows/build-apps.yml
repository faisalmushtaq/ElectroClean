# Builds the stand-alone ElectroClean applications for Windows, macOS and Linux,
# checks each one with its own --self-test, and runs the test-suite on the same
# three systems. See docs/building_apps.md.
#
# To keep the use of Actions minutes low (the repository is private, and macOS
# and Windows minutes cost more), an ordinary push only runs the test-suite on
# Linux. The full set (tests and builds on all three systems) runs when it is
# started by hand ("Run workflow" in the Actions tab), for pull requests into
# main, and when a version tag such as v1.1.0 is pushed.
name: Build applications

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Qt's run-time needs on Ubuntu. The xcb packages are not needed offscreen, but when they are present
  # PyInstaller bundles them, so annotators' Linux machines need not have them (libxcb-cursor0 in particular).
  LINUX_QT_PACKAGES: >-
    libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
    libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
    libxcb-shape0 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux only for ordinary pushes; all three systems otherwise (see the top of this file).
        os: ${{ fromJSON((github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) && '["ubuntu-22.04"]' || '["windows-latest", "macos-latest", "ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_QT_PACKAGES
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run the test-suite
        run: python -m pytest -q

  build:
    name: Build (${{ matrix.os }})
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon (arm64). Intel Macs would need an Intel runner such as
        # macos-15-intel, added here as a fourth entry.
        os: [windows-latest, macos-latest, ubuntu-22.04]  # 22.04: older glibc, so the Linux build runs on more systems
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_QT_PACKAGES
      # Fresh build environment, PyInstaller, frozen --self-test, console tools' --help, zip.
      - name: Build and test the applications
        id: build
        run: python packaging/build.py --zip
      - name: Upload the applications
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.zip }}
          archive: false  # the artifact is the zip itself (ElectroClean-<os>-<arch>.zip), not a zip of it
          retention-days: 30
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.os }}
          path: |
            build/selftest-*.log
            build/pyinstaller/electroclean/warn-electroclean.txt
            build/pyinstaller/electroclean/xref-electroclean.html
          retention-days: 14
          if-no-files-found: ignore
