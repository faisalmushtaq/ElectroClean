# Runs the Python test-suite: the annotation core, the agreement, training and activity analyses,
# the ElectroClean server and the Firebase code (the browser application has its own workflow,
# web-tests.yml). The commands (electroclean-web, electroclean-agreement, electroclean-admin and
# electroclean-activity) run on researchers' own computers, so the suite runs on Windows, macOS and
# Linux for pushes to main, pull requests into main and runs started by hand ("Run workflow" in the
# Actions tab). Pushes to other branches run it on Linux only, which is quicker. Python 3.12, the
# oldest version ElectroClean supports, is tested on Linux every time.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux only for pushes to branches other than main; all three systems otherwise (see the top of this file).
        os: ${{ fromJSON((github.event_name == 'push' && github.ref != 'refs/heads/main') && '["ubuntu-24.04"]' || '["windows-latest", "macos-latest", "ubuntu-24.04"]') }}
        python: ["3.13"]
        include:
          - os: ubuntu-24.04
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install requirements and ElectroClean
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: The commands start
        run: |
          python -m electroclean
          electroclean-web --help
          electroclean-agreement --help
          electroclean-admin --help
          electroclean-activity --help
      - name: Run the test-suite
        run: python -m pytest -q
