# Tests of the browser version: the browser modules (node --test), the application in Chromium
# against the demonstration and the real study server (Playwright), the same in WebKit, the engine
# of Safari on iPads and Macs (with the iPad's touch, layouts and file pickers), and a study on Firebase on the
# Firebase Emulator Suite (the functions' tests and the application signing in, annotating,
# training and exporting). See docs/web/server.md and docs/web/firebase.md.
#
# Runs when the browser version, its server or these tests change. Nothing reaches a real Firebase
# project: the emulators' project ID starts with "demo-".
name: Browser version tests

on:
  push:
    branches: [main, claude/electroclean-web]
    paths:
      - "electroclean/**"
      - "web_tests/**"
      - "scripts/make_web_fixtures.py"
      - "scripts/test_*firebase*.sh"
      - "scripts/vendor_functions.py"
      - "firebase.json"
      - "firestore.rules"
      - "requirements*.txt"
      - ".github/workflows/web-tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  PLAYWRIGHT_VERSION: "1.63.0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  browser:
    name: Browser modules and end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Python requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: Browser modules (node --test)
        env:
          ELECTROCLEAN_PYTHON: python
        run: node --test web_tests/unit/*.test.mjs
      - name: The application in Chromium (demonstration and the real study server)
        env:
          ELECTROCLEAN_PYTHON: python
        run: node web_tests/run_e2e.mjs --screenshots e2e-screenshots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
          retention-days: 14

  webkit:
    name: End-to-end in WebKit (Safari's engine, as on an iPad)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Python requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Install Playwright and WebKit
        run: |
          npm install --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps webkit
      - name: The application in WebKit (demonstration, the real study server, iPads)
        env:
          ELECTROCLEAN_PYTHON: python
        run: node web_tests/run_e2e.mjs --browser webkit --screenshots webkit-screenshots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webkit-screenshots
          path: webkit-screenshots
          if-no-files-found: ignore
          retention-days: 14

  firebase:
    name: Firebase on the emulators
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            electroclean/web/firebase/functions/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Python requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: The functions and the Firestore store (pytest on the emulators)
        env:
          PYTHON: python
        run: bash scripts/test_firebase_emulators.sh
      - name: The application with a study on Firebase (Chromium on the emulators)
        env:
          PYTHON: python
        run: bash scripts/test_web_firebase.sh --screenshots firebase-screenshots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firebase-screenshots
          path: firebase-screenshots
          if-no-files-found: ignore
          retention-days: 14
