[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electroclean"
dynamic = ["version"]
description = "Manual EEG artifact annotation in the web browser, inter-rater reliability analysis and annotator competency assessment"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ElectroClean contributors" }]
# Free for research, teaching and other non-commercial use (source-available, not OSI open source).
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Ranges known to work; exact versions used for testing are in requirements.txt.
dependencies = [
  "mne>=1.8,<1.14",  # reading recordings: registering them, expert recordings for reference sets
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pybv>=0.7",  # simulated recordings for the demonstration, the example training set and the examples
  # The ElectroClean server (electroclean-web serve and demo)
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  # Studies on Firebase (the administrator's commands with --firebase-project)
  "firebase-admin>=6.5",
  "google-cloud-firestore>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
electroclean-agreement = "electroclean.reliability.cli:main"
electroclean-admin = "electroclean.training.cli:main"
electroclean-activity = "electroclean.activity.cli:main"
electroclean-web = "electroclean.web.cli:main"

[tool.setuptools.dynamic]
version = { attr = "electroclean.__version__" }

[tool.setuptools.packages.find]
include = ["electroclean*"]
# The Cloud Functions are deployed from their folder (firebase.json), not installed with the package.
exclude = ["electroclean.web.firebase.functions*"]

[tool.setuptools.package-data]
electroclean = ["config/*.json", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: longer end-to-end tests",
]

[tool.ruff]
line-length = 120
